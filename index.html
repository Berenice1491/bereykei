<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind</title>
  </head>
  <body>
    <div class="grid">
      <div class="flex">
        <img
          class=""
          src="assets/style/images/tail-removebg-preview.png"
          alt=""
        />
        <h1 class="font-family:Inter sans-serif mt-4.5 font-semibold text-4xl">
          tailwindcss
        </h1>
      </div>
      <h2 class="text-6xl font-extrabold">
        Rapidly build modern websites<br />
        without ever leaving your HTML.
      </h2>
    </div>
    <p class="text-2xl text-gray-500">
      A utility-first CSS framework packed with classes like flex, pt-4,
      text-center and <br />
      rotate-90 that can be composed to build any design, directly in your
      markup.
    </p>

    <button class="rounded-lg bg-yellow-400 h-10 w-30">Get started</button>
    <button class="rounded-lg bg-yellow-400 h-10 w-55">
      npm install tailwindcss
    </button>
  </body>
</html>
