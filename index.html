<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind</title>
  </head>
  <body>
    <div
      class="justify-center items-center m-0 grid w-4/5 h-70px mt-50 ml-40 mb-95"
    >
      <div class="grid">
        <div class="flex">
          <img
            class="h-12 w-70"
            src="assets/style/images/dhfhgdhddfhdhdfdfh-removebg-preview.png"
            alt=""
          />
        </div>
        <h2
          class="text-7xl font-bold leading-16.5 font-family:Inter sans-serif mt-10"
        >
          Rapidly build modern websites<br />
          without ever leaving your HTML.
        </h2>
      </div>
      <p class="text-2xl text-gray-500 inline-block mt-10 leading-10">
        A utility-first CSS framework packed with classes like
        <b class="text-black">flex, pt-4, text-center</b> and <br />
        <b class="text-black">rotate-90</b> that can be composed to build any
        design, directly in your markup.
      </p>

      <div class="mt-10 flex gap-[20px]">
        <button class="rounded-lg bg-black h-12 w-27 hover:bg-gray-700">
          <p class="text-white font-semibold">Get started</p>
        </button>
        <button
          class="rounded-lg bg-gray-100 h-12 w-70 flex items-center border border-gray-200 flex items-center justify-between"
        >
          <p class="items-center flex ml-6">$ npm install tailwindcss</p>
          <svg
            class="mr-5 text-gray-500"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              d="M8 16c0 1.886 0 2.828.586 3.414C9.172 20 10.114 20 12 20h4c1.886 0 2.828 0 3.414-.586C20 18.828 20 17.886 20 16v-4c0-1.886 0-2.828-.586-3.414C18.828 8 17.886 8 16 8m-8 8h4c1.886 0 2.828 0 3.414-.586C16 14.828 16 13.886 16 12V8m-8 8c-1.886 0-2.828 0-3.414-.586C4 14.828 4 13.886 4 12V8c0-1.886 0-2.828.586-3.414C5.172 4 6.114 4 8 4h4c1.886 0 2.828 0 3.414.586C16 5.172 16 6.114 16 8"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
