<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/style/claude.css" />
    <link rel="stylesheet" href="./assets/style/body.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Goudy+Bookletter+1911&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <title>Claude</title>
  </head>

  <body>
    <header>
      <a href="">
        <img
          src="assets/style/images/claude_ogimage-removebg-preview-removebg-preview.png"
          alt="claude logo"
        />
      </a>
      <nav>
        <ul class="opciones">
          <li><a href="">Conozca a Claude</a></li>
          <li><a href="">Plataforma</a></li>
          <li><a href="">Soluciones</a></li>
          <li><a href="">Precios</a></li>
          <li><a href="">Recursos</a></li>
        </ul>
        <div class="botones">
          <button class="boton">Contactar con ventas</button>
          <button class="boton blanco">Probar Claude</button>
        </div>
      </nav>
    </header>

    <div class="caja-body">
      <section class="seccion-cuenta">
        <div class="cuenta">
          <div class="texto">
            <h1>
              Piensa rápido, <br />
              construye más rápido
            </h1>

            <h3 class="h3">
              Haz lluvia de ideas en Claude, construye en Cowork
            </h3>
          </div>
          <div class="caja-cuenta">
            <div class="contenedor">
              <button class="boton-google">
                <img
                  src="assets/style/images/google-removebg-preview.png"
                  alt=""
                />
                <p>Continuar con Google</p>
              </button>

              <p class="O">o</p>

              <form action="">
                <input type="email" placeholder="Introduce tu email" />
              </form>

              <button class="boton-correo">
                <p>Continuar con correo electrónico</p>
              </button>
              <p class="poli">
                Al continuar, reconoces la
                <a
                  class="link-politica"
                  href="https://www.anthropic.com/legal/archive/d254257b-3920-4d8c-842d-b193c7372ba9"
                  >Política de Privacidad</a
                >
                de Anthropic.
              </p>
            </div>
          </div>
          <div class="caja-descarga">
            <button class="boton-windows">
              <img
                class="windo"
                src="assets/style/images/nGpunkt-removebg-preview.png"
                alt=""
              />
              <p class="apli">Descargar aplicación de escritorio</p>
            </button>
          </div>
        </div>
      </section>
      <section class="seccion-imagen">
        <img src="assets/style/images/Captura.PNG" alt="Imagen de claude" />
      </section>
    </div>
  </body>
</html>
