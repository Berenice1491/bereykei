<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <h1>Formulario</h1>
    <form action="">
      <p>Ingresa la informacion solicitada a continuacion</p>
      <input placeholder="Ingresa tu nombre y apellido" type="text" required />
      <br />
      <input placeholder="Ingresa tu email" type="email" required /> <br />
      <input placeholder="Ingresa tu contraseña" type="password" required />
      <br />
      <h4>Género</h4>
      <input type="radio" /> Mujer <input type="radio" /> Hombre
      <input type="checkbox" /> Prefiero no decirlo. <br />
      <h4>¿Te gusta nuestra pagina?</h4>
      <select name="Te gusta nuestra pagina" id="">
        <option value="">Si.</option>
        <option value="">No.</option>
        <option value="">Podria mejorar.</option>
      </select>
      <p>
        En caso de que tu respuesta haya sido "Podría mejorar", ¿qué cambiarías
        o qué agregarías?
      </p>
      <textarea name="" id=""></textarea>
    </form>
  </body>
</html>
